<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sneak Out · Tele</title>
<link rel="stylesheet" href="css/estilo.css?v=41">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icono2-192.png">
<link rel="apple-touch-icon" href="icons/icono2-apple-180.png">
<meta name="theme-color" content="#0b1026">
</head>
<body class="tv">
<canvas id="map"></canvas>

<div id="sConnecting" class="screen"><h1 data-i18n="tv.connecting"></h1></div>

<div id="sLobby" class="screen lobby hidden">
  <div class="left">
    <h1 data-i18n="app.title"></h1>
    <div class="muted" data-i18n="tv.code" style="font-size:1.6vw"></div>
    <div class="code" id="code">----</div>
    <div data-i18n="tv.joinHow" style="font-size:1.5vw"></div>
    <div class="url" id="url"></div>
    <div class="row" style="justify-content:flex-start;gap:1.5vw">
      <div class="qr" id="qr"></div>
      <div class="muted" data-i18n="tv.orScan" style="font-size:1.4vw"></div>
    </div>
  </div>
  <div class="right">
    <h2 style="margin:0;font-size:2vw" data-i18n="tv.players"></h2>
    <div class="plist" id="plist"></div>
    <div class="muted" id="botsFill" style="font-size:1.4vw"></div>
  <div class="autoBox hidden" id="tvAuto" style="font-size:1.8vw"></div>
    <div class="settings">
      <span data-i18n="tv.total"></span>
      <div class="stepper"><button class="sec" id="totalMinus">−</button><b id="totalVal">8</b><button class="sec" id="totalPlus">+</button></div>
      <span data-i18n="tv.impostors"></span>
      <div class="seg" id="setImp"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div>
      <span data-i18n="tv.botLevel"></span>
      <div class="seg" id="setBot"><button data-v="easy" data-i18n="tv.easy"></button><button data-v="normal" data-i18n="tv.normal"></button><button data-v="hard" data-i18n="tv.hard"></button></div>
      <span data-i18n="tv.map"></span>
      <div class="seg" id="setMap"><button data-v="nave" data-i18n="map.nave"></button><button data-v="nave2" data-i18n="map.nave2"></button><button data-v="abisal" data-i18n="map.abisal"></button></div>
      <span data-i18n="lang.label"></span>
      <div class="seg" id="setLang"><button data-v="es">Español</button><button data-v="en">English</button></div>
    </div>
    <div class="row" style="justify-content:flex-start">
      <button class="big" id="btnStart" data-i18n="tv.start"></button>
      <button class="sec" id="btnSettings" data-i18n="set.open"></button>
      <button class="sec" id="btnFs" data-i18n="tv.fullscreen"></button>
    </div>
  </div>
</div>

<div id="sIntro" class="screen overlay hidden">
  <p class="bigtitle" id="introTitle"></p>
  <p class="subtitle" data-i18n="tv.roleIntro"></p>
</div>

<div id="sPlay" class="hidden">
  <div class="topbar">
    <span data-i18n="tv.tasks"></span>
    <div class="taskbar"><div id="taskFill"></div></div>
    <span id="clock">0:00</span>
  </div>
  <div class="alert hidden" id="lightsAlert" data-i18n="tv.lightsOut"></div>
  <div class="alert reactor hidden" id="reactorAlert"></div>
</div>

<div id="sMeeting" class="screen overlay hidden">
  <div class="tvSplash hidden" id="tvSplash"><div id="tvSplashTitle"></div></div>
  <p class="bigtitle" data-i18n="tv.meeting"></p>
  <p class="subtitle" id="mReason"></p>
  <div class="row" style="gap:2vw"><span class="subtitle" id="mPhase"></span><span class="timer" id="mTimer"></span></div>
  <div class="mgrid" id="mGrid"></div>
  <div class="talkBox tv hidden" id="tvTalk"></div>
</div>

<div id="sEject" class="screen overlay hidden">
  <div class="ejectStage" id="ejectStage"></div>
  <p class="subtitle" id="ejectText" style="font-size:3vw;font-weight:900"></p>
  <p class="subtitle" id="ejectSub"></p>
  <div class="mgrid" id="ejectGrid"></div>
</div>

<div id="sEnd" class="screen overlay hidden">
  <p class="bigtitle" id="endTitle"></p>
  <p class="subtitle" id="endReason"></p>
  <p class="subtitle" id="endImpLabel"></p>
  <div class="row" id="endImps" style="gap:2vw"></div>
  <p class="muted" id="endTime" style="font-size:1.5vw"></p>
  <button class="big" id="btnAgain" data-i18n="tv.again"></button>
</div>

<div class="screen overlay hidden setModal" id="setModal">
  <h2 data-i18n="set.title"></h2>
  <div class="setPanel" id="setPanel"></div>
  <button class="big" id="setClose" data-i18n="ph.close"></button>
</div>

<div class="lost hidden" id="lost"><span data-i18n="tv.lostTitle"></span> · <span data-i18n="tv.lostText"></span></div>

<script src="vendor/peerjs.min.js?v=41"></script>
<script src="vendor/trystero.min.js?v=41"></script>
<script src="js/rebote.js?v=41"></script>
<script src="vendor/qrcode.js?v=41"></script>
<script src="js/i18n.js?v=41"></script>
<script src="js/huellas.js?v=41"></script>
<script src="js/map.js?v=41"></script>
<script src="js/game.js?v=41"></script>
<script src="js/personajes-data.js?v=41"></script>
<script src="js/fondo.js?v=41"></script>
<script src="js/efectos.js?v=41"></script>
<script src="js/disfraces.js?v=41"></script>
<script src="js/draw.js?v=41"></script>
<script src="js/nave.js?v=41"></script>
<script src="js/abisal.js?v=41"></script>
<script src="js/net.js?v=41"></script>
<script src="js/servidor.js?v=41"></script>
<script src="js/ajustes.js?v=41"></script>
<script src="js/tele.js?v=41"></script>
<script>if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }</script>
</body>
</html>

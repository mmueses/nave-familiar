<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>Nave Familiar · Móvil</title>
<link rel="stylesheet" href="css/estilo.css?v=6">
</head>
<body class="ph">

<div id="sJoin" class="screen scroll">
  <div class="form">
    <h1 style="text-align:center" data-i18n="app.title"></h1>
    <label for="code" id="codeLabel" data-i18n="ph.code"></label>
    <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
    <label for="name" data-i18n="ph.name"></label>
    <input id="name" maxlength="12" autocomplete="off">
    <label data-i18n="ph.color"></label>
    <div class="swatches" id="sw1"></div>
    <div id="joinErr" style="color:#ff8080;font-weight:700"></div>
    <button class="big" id="btnJoin" data-i18n="ph.join"></button>
  </div>
</div>

<div id="sWait" class="screen hidden"><h2 id="waitText"></h2></div>

<div id="sLobby" class="screen hidden scroll" style="gap:14px">
  <div class="roomBox hidden" id="roomBox">
    <div class="muted" data-i18n="ph.roomCode"></div>
    <div class="roomCode" id="roomCode">····</div>
    <div class="qr" id="roomQr"></div>
    <div id="roomStatus" class="roomStatus"></div>
    <div class="muted small" data-i18n="ph.roomHow"></div>
    <div class="muted small" data-i18n="ph.hostKeep"></div>
  </div>
  <div class="muted" data-i18n="ph.youAre"></div>
  <div id="meAvatar"></div>
  <h2 id="meName" style="margin:0"></h2>
  <div class="swatches" id="sw2" style="width:min(420px,94vw)"></div>
  <div class="muted" id="waitingTxt" data-i18n="ph.waiting"></div>
  <div class="plist" id="lobbyList"></div>
  <div id="hostBox" class="hidden" style="display:flex;flex-direction:column;gap:10px;align-items:center">
    <div class="muted" id="hostHint" data-i18n="ph.hostHint"></div>
    <div class="row"><span data-i18n="tv.total"></span><div class="stepper"><button class="sec" id="pMinus">−</button><b id="pTotalVal">8</b><button class="sec" id="pPlus">+</button></div></div>
    <div class="row"><span data-i18n="tv.impostors"></span><div class="seg" id="pImp"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div></div>
    <div class="row"><span data-i18n="lang.label"></span><div class="seg" id="pLang"><button data-v="es">ES</button><button data-v="en">EN</button></div></div>
    <button class="big" id="btnStart" data-i18n="ph.startHere"></button>
  </div>
</div>

<div id="sIntro" class="screen hidden intro">
  <div class="role" id="introRole"></div>
  <div id="introSub" class="introSub"></div>
  <canvas id="lineupCv" class="lineup"></canvas>
  <div id="introHint" style="font-size:1.05em;max-width:90vw"></div>
  <div class="muted" data-i18n="ph.tapHide"></div>
  <div class="cover hidden" id="cover" data-i18n="ph.tapHide"></div>
</div>

<div id="sPlay" class="screen hidden">
  <canvas id="cv"></canvas>
  <div class="joyZone" id="joyZone"></div>
  <div class="joyBase" id="joyBase"><i id="knob"></i></div>
  <div class="hud">
    <div class="tasks" id="taskBox"></div>
    <div class="hudRight">
      <div class="rolebadge" id="badge"></div>
      <button class="sec mapbtn" id="btnMap">🗺️</button>
    </div>
  </div>
  <div class="alertbar hidden" id="phLights" data-i18n="ph.lightsOut"></div>
  <div class="alertbar reactor hidden" id="phReactor"></div>
  <div class="msg hidden" id="ghostMsg" data-i18n="ph.ghost"></div>
  <div class="msg hidden" id="ventMsg" data-i18n="ph.inVent"></div>
  <div class="controls" id="controls">
    <button class="act sab hidden" id="bLights"><span data-i18n="ph.lights"></span><span class="cd hidden"></span></button>
    <button class="act sab hidden" id="bReactor"><span data-i18n="ph.reactorBtn"></span><span class="cd hidden"></span></button>
    <button class="act vent hidden" id="bVent" data-i18n="ph.vent"></button>
    <button class="act vent hidden" id="bNext" data-i18n="ph.ventNext"></button>
    <button class="act frz hidden" id="bFrz"><span data-i18n="ph.freeze"></span><span class="cd hidden"></span></button>
    <button class="act rep" id="bRep" data-i18n="ph.report"></button>
    <button class="act use" id="bUse" data-i18n="ph.use"></button>
  </div>
</div>

<div id="sMeeting" class="screen hidden scroll" style="gap:10px;justify-content:flex-start;padding-top:calc(20px + env(safe-area-inset-top))">
  <h2 style="margin:0" data-i18n="tv.meeting"></h2>
  <div id="mReason" class="muted" style="font-size:1.05em"></div>
  <div class="timer" id="mTimer"></div>
  <div id="mDiscuss" style="display:flex;flex-direction:column;gap:12px;align-items:center">
    <div style="font-size:1.2em" data-i18n="ph.discuss"></div>
    <button class="big" id="btnReady" data-i18n="ph.readyVote"></button>
    <div class="muted hidden" id="readyWait" data-i18n="ph.waitOthers"></div>
  </div>
  <div id="mVote" class="hidden" style="display:flex;flex-direction:column;gap:10px;align-items:center">
    <div style="font-size:1.2em;font-weight:700" id="voteTitle"></div>
    <div class="votelist" id="voteList"></div>
  </div>
</div>

<div id="sInfo" class="screen hidden" style="gap:12px">
  <canvas id="ejectCv" class="ejectCv hidden"></canvas>
  <div class="infoBox">
    <div id="infoIcon" style="font-size:3em">📺</div>
    <h1 id="infoTitle"></h1>
    <div id="infoText" style="font-size:1.2em"></div>
    <div id="infoSub" style="font-size:1.1em;max-width:90vw"></div>
    <button class="big hidden" id="btnLobby" data-i18n="ph.again"></button>
  </div>
</div>

<div id="splash" class="splash hidden">
  <div class="splashTitle" id="splashTitle"></div>
  <div id="splashArt"></div>
</div>

<div id="mgModal" class="modal hidden">
  <button class="x" id="mgClose" data-i18n="ph.close"></button>
  <div id="mgBox"></div>
</div>

<div id="mapModal" class="modal hidden">
  <button class="x" id="mapClose" data-i18n="ph.close"></button>
  <canvas class="minimap" id="miniCv"></canvas>
</div>

<div id="camModal" class="modal hidden">
  <button class="x" id="camClose" data-i18n="ph.close"></button>
  <div class="modalTitle" data-i18n="ph.camsTitle"></div>
  <div class="camGrid"><canvas></canvas><canvas></canvas><canvas></canvas><canvas></canvas></div>
</div>

<div id="admModal" class="modal hidden">
  <button class="x" id="admClose" data-i18n="ph.close"></button>
  <div class="modalTitle" data-i18n="ph.adminTitle"></div>
  <canvas class="minimap" id="admCv"></canvas>
</div>

<script src="vendor/peerjs.min.js?v=6"></script>
<script src="js/i18n.js?v=6"></script>
<script src="js/map.js?v=6"></script>
<script src="js/game.js?v=6"></script>
<script src="js/draw.js?v=6"></script>
<script src="js/net.js?v=6"></script>
<script src="vendor/qrcode.js?v=6"></script>
<script src="js/servidor.js?v=6"></script>
<script src="js/minijuegos.js?v=6"></script>
<script src="js/movil.js?v=6"></script>
</body>
</html>

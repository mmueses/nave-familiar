<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sneak Out</title>
<link rel="stylesheet" href="css/estilo.css?v=31">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icono2-192.png">
<link rel="apple-touch-icon" href="icons/icono2-apple-180.png">
<meta name="theme-color" content="#0b1026">
</head>
<body>
<div class="screen home">
  <div class="logo" id="logo" aria-label="Sneak Out"></div>
  <div class="tagline" data-i18n="app.subtitle"></div>
  <div class="menu">
    <a class="mbtn green" id="toSolo" href="movil.html?solo=1" style="--d:0.15s">
      <span class="mico">🎮</span><span class="mtxt"><b data-i18n="home.solo"></b><small data-i18n="home.soloHint"></small></span><span class="marrow">›</span>
    </a>
    <a class="mbtn orange" id="toFamily" href="movil.html?crear=1" style="--d:0.25s">
      <span class="mico">👨‍👩‍👧</span><span class="mtxt"><b data-i18n="home.family"></b><small data-i18n="home.familyHint"></small></span><span class="marrow">›</span>
    </a>
    <a class="mbtn blue" id="toPhone" href="movil.html" style="--d:0.35s">
      <span class="mico">📱</span><span class="mtxt"><b data-i18n="home.phone"></b><small data-i18n="home.phoneHint"></small></span><span class="marrow">›</span>
    </a>
    <a class="mbtn pink" id="toTv" href="tele.html" style="--d:0.45s">
      <span class="mico">📺</span><span class="mtxt"><b data-i18n="home.tv"></b><small data-i18n="home.tvHint"></small></span><span class="marrow">›</span>
    </a>
  </div>
  <div class="footbar">
    <button class="rbtn" id="btnLang" aria-label="Idioma / Language"><span>🌐</span><small id="langTxt">ES</small></button>
    <button class="rbtn" id="btnShare" aria-label="Compartir"><span>📤</span><small data-i18n="home.shareShort"></small></button>
    <button class="rbtn hidden" id="btnInstall" aria-label="Instalar"><span>📲</span><small data-i18n="home.installShort"></small></button>
  </div>
  <div class="muted small hidden" id="installHelp" data-i18n="app.installHelp" style="max-width:420px"></div>
  <div class="muted small hidden" id="shareMsg" style="max-width:420px"></div>
  <div class="ver">v31</div>
</div>
<script src="js/personajes-data.js?v=31"></script>
<script src="js/fondo.js?v=31"></script>
<script src="js/i18n.js?v=31"></script>
<script>
  (function () {
    var q = location.search;
    // Si llega con código (QR), ir directo al móvil
    if (/[?&]sala=/.test(q)) { location.replace('movil.html' + q); return; }
    if (q) { document.getElementById('toTv').href += q; document.getElementById('toPhone').href += q; document.getElementById('toSolo').href += '&' + q.slice(1); document.getElementById('toFamily').href += '&' + q.slice(1); }
    // Título con letras sueltas: rebotan al entrar y de vez en cuando una «se esconde» (como el impostor)
    function logo() {
      var el = document.getElementById('logo'), txt = t('app.title'), i = 0; el.innerHTML = '';
      txt.split(' ').forEach(function (word, wi) {
        var w = document.createElement('span'); w.className = 'word w' + (wi % 3);
        word.split('').forEach(function (ch) { var sp = document.createElement('span'); sp.className = 'ch'; sp.textContent = ch; sp.style.setProperty('--i', i++); w.appendChild(sp); });
        el.appendChild(w);
      });
    }
    setInterval(function () {
      var ls = document.querySelectorAll('#logo .ch'); if (!ls.length) return;
      var l = ls[Math.floor(Math.random() * ls.length)]; l.classList.add('sneak');
      setTimeout(function () { l.classList.remove('sneak'); }, 1600);
    }, 3500);
    function paint() {
      I18N.apply(); logo();
      document.getElementById('langTxt').textContent = I18N.lang.toUpperCase();
    }
    document.getElementById('btnLang').onclick = function () { I18N.set(I18N.lang === 'es' ? 'en' : 'es'); paint(); };
    paint();
    FONDO.start({ parade: true, lane: [0.93, 0.99] });
    document.querySelectorAll('.mbtn, .rbtn').forEach(function (b) { b.addEventListener('pointerdown', function () { try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} }); });
    document.getElementById('toSolo').focus();
    // Instalar como app (Android: Chrome ofrece el aviso; si no, se explica cómo hacerlo a mano)
    var installEvt = null, $ = function (id) { return document.getElementById(id); };
    var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || /[?&]app=1/.test(location.search);
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; $('btnInstall').classList.remove('hidden'); $('installHelp').classList.add('hidden'); });
    if (!standalone) setTimeout(function () { if (!installEvt) $('installHelp').classList.remove('hidden'); }, 1500);
    $('btnInstall').onclick = function () {
      if (!installEvt) return;
      installEvt.prompt();
      installEvt.userChoice.then(function () { installEvt = null; $('btnInstall').classList.add('hidden'); });
    };
    window.addEventListener('appinstalled', function () { $('btnInstall').classList.add('hidden'); $('installHelp').classList.add('hidden'); });
    // Compartir el enlace con la familia (WhatsApp, etc.)
    var url = location.href.split('?')[0].split('#')[0];
    $('btnShare').onclick = function () {
      var text = t('app.shareText');
      if (navigator.share) { navigator.share({ title: t('app.title'), text: text, url: url }).catch(function () {}); return; }
      try { navigator.clipboard.writeText(text + ' ' + url); } catch (e) {}
      $('shareMsg').textContent = t('app.copied') + ' ' + url;
      $('shareMsg').classList.remove('hidden');
    };
  })();
</script>
<script>if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }</script>
</body>
</html>
